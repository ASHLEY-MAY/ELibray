<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
</head>

<body>
    <form action="{{url_for('auth.login')}}" method="POST">
        <div>
            <h1>Login</h1>
            <label for="username">Username</label>
            <input type="text" placeholder="username" id="username" name="username">
            <label for="password">Passwsord</label>
            <input type="password" placeholder="password" id="passwrod" name="password">
        </div>
        <h5>Forget Password? <a href="{{url_for('auth.forget')}}">Reset Password</a></h5>
        <button type="submit" class="submit">Login</button>
        <h5>Don't have a account? <a href="{{url_for('auth.register')}}">Create an account</a></h5>
    </form>
</body>

</html>
